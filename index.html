<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<title>Jill's Economic Indicators Dashboard</title>
<meta name="viewport" content="width=1700, initial-scale=1, minimum-scale=0.1, maximum-scale=5, user-scalable=yes">
<style>
  :root { --bg: #dcecfa; --card: #ffffff; --line: #e1e5eb; --text: #1c2430; --muted: #6b7686; --up: #1a7f4b; --down: #c0392b; --bar: #1a3a7a; --accent: #d9822b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.4; }
  header { padding: 22px 1in 6px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 650; }
  .stamp { color: var(--muted); font-size: 13px; }
  nav { padding: 4px 1in 0; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  nav a { color: #14285a; font-weight: 700; text-decoration: none; } nav a:hover { text-decoration: underline; }
  main { padding: 0 1in 40px; max-width: none; margin: 0; }
  h2 { font-size: 17px; margin: 30px 0 4px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .grid { display: grid; gap: 14px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
  .charts { grid-template-columns: repeat(auto-fill, minmax(min(470px, 100%), 1fr)); }
  .watch { grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; }
  .tile .label { font-size: 13px; color: #000; }
  .tile .value { font-size: 28px; font-weight: 650; margin: 2px 0; letter-spacing: -0.3px; }
  .tile .chg { font-size: 14px; font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .tile .asof { font-size: 12px; color: #000; margin-top: 4px; }
  .tile .flat { color: #000; }
  .tile svg { display: block; margin-top: 6px; }
  .tile.wide { grid-column: 1 / -1; padding: 6px 8px 0; max-width: 540px; }
  @media (min-width: 1560px) { .tiles6 { grid-template-columns: repeat(6, 1fr); } }
  @media (min-width: 900px) { .tiles4 { grid-template-columns: repeat(4, 1fr); } }
  .tiles6 > .tile { display: flex; flex-direction: column; }
  .tiles6 > .tile > svg { width: 100%; height: auto; } .tiles6 > .tile > svg.spk { height: 34px; }
  .tiles6 > .tile .asof { margin-top: auto; padding-top: 8px; }
  .watch .card.wide { grid-column: 1 / -1; }
  @media (min-width: 1000px) { .watch3 { grid-template-columns: 1fr 1fr 1fr; } }
  .watch3 > .card > svg { max-width: 100%; height: auto; }
  @media (min-width: 1500px) { .real4 { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1500px) { .watch3 { grid-template-columns: 280px 280px 380px 230px 280px; } }
  @media (min-width: 900px) { .tile.wide { grid-column: span 2; grid-row: span 2; } }
  .card h3 { margin: 0 0 2px; font-size: 15px; font-weight: 650; }
  .card .note { font-size: 12.5px; color: #000; margin: 2px 0 8px; }
  .card .legend { color: #000; }
  .card svg text[fill="#6b7686"] { fill: #000; }
  .card svg[width="100%"] text { fill: #000 !important; }
  .gauge-num { font-size: 26px; font-weight: 650; }
  .pending { border-style: dashed; background: #fafbfc; }
  .src { font-size: 12px; color: var(--muted); }
  .src .ok { color: var(--up); } .src .bad { color: var(--down); font-weight: 600; }
  svg text { font-family: "Segoe UI", system-ui, sans-serif; }
  .legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  td.num, th.num { text-align: right; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; margin-bottom: 8px; }
  summary { cursor: pointer; font-weight: 650; }
  .ix { padding: 8px 0; border-top: 1px solid var(--line); }
  .ix:first-of-type { border-top: 0; }
  .ix b { display: block; }
  .ix span { color: var(--muted); font-size: 12.5px; }
  a { color: #1a3a7a; }
</style>
</head>
<body>
<header>
  <h1>Jill's Economic Indicators Dashboard</h1>
  <div class="stamp" id="stamp"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script src="data.js"></script>
<script src="monthly.js"></script>
<script src="index.js"></script>
<script src="releases.js"></script>
<script src="houston-housing.js"></script>
<script src="elections.js"></script>
<script src="listening.js"></script>
<script src="history.js"></script>
<script src="crude.js"></script>
<script>
(function () {
  var main = document.getElementById('main');
  if (typeof DATA === 'undefined') { main.innerHTML = '<p>data.js is missing. Run UPDATE-ECON-DASHBOARD.ps1 once to create it.</p>'; return; }
  var M = (typeof MONTHLY !== 'undefined') ? MONTHLY : { series: [], vacancy: [], ercot: null, manual: [], status: [] };
  var IDX = (typeof INDEX !== 'undefined') ? INDEX : [];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function fmt(v, dec) { return Number(v).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }).replace(/^-(0(\.0+)?)$/, '$1'); }

  function monthLabel(d) { var p = d.split('-'); return MON[+p[1] - 1] + '-' + p[0].slice(2); }
  function qLabel(d) { var p = d.split('-'); return 'Q' + (Math.floor((+p[1] - 1) / 3) + 1) + '-' + p[0].slice(2); }
  function dayLabel(d) { var p = d.split('-'); return MON[+p[1] - 1] + ' ' + (+p[2]); }
  function dateLabel(d) { var p = d.split('-'); return MON[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0]; }
  function arr(points) {
    return { labels: points.map(function (p) { return p.d; }), vals: points.map(function (p) { return (p.v === undefined || p.v === null) ? null : p.v; }) };
  }
  function manual(name) { return (M.manual || []).filter(function (g) { return g.indicator === name; })[0]; }
  function mseries(id) { return (M.series || []).filter(function (s) { return s.id === id; })[0]; }
  function bseries(id) { return (DATA.bls || []).filter(function (s) { return s.id === id; })[0]; }

  document.getElementById('stamp').textContent = 'Daily data refreshed ' + DATA.generated + (M.generated ? '. Slower data refreshed ' + M.generated : '') + ' (Central).';

  /* ---------- small drawing helpers ---------- */
  function spark(vals, w, h) {
    w = w || 190; h = h || 34;
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (max === min) { max += 1; min -= 1; }
    var pts = vals.map(function (v, i) { return (i / Math.max(1, vals.length - 1) * w).toFixed(1) + ',' + (h - 3 - (v - min) / (max - min) * (h - 6)).toFixed(1); }).join(' ');
    return '<svg class="spk" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><polyline fill="none" stroke="#1a3a7a" stroke-width="1.6" vector-effect="non-scaling-stroke" points="' + pts + '"/></svg>';
  }
  function change(vals, lag, kind) {
    return vals.map(function (v, i) {
      if (v === null || i - lag < 0 || vals[i - lag] === null) return null;
      var p = vals[i - lag];
      return kind === 'pct' ? (v / p - 1) * 100 : v - p;

  }
  function axis(vals, include) {
    var nums = vals.filter(function (v) { return v !== null; });
    if (include !== undefined) nums = nums.concat(include);
    if (!nums.length) return { min: 0, max: 1 };
    var mn = Math.min(0, Math.min.apply(null, nums)), mx = Math.max(0, Math.max.apply(null, nums));
    if (include !== undefined) { mn = Math.min.apply(null, nums); mx = Math.max.apply(null, nums); }
    if (mx === mn) mx += 1;
    var pad = (mx - mn) * 0.08; mx += pad; if (mn < 0 || include !== undefined) mn -= pad;
    return { min: mn, max: mx };
  }
  function xLabels(labels, W, L, step, every, dy) { dy = dy || 0;
    var out = '';
    labels.forEach(function (lb, i) {
      var last = labels.length - 1; if (!((i % every === 0 && last - i >= every / 2) || i === last)) return;
      var p = String(lb).split('-'), x = (L + i * step + step / 2).toFixed(1);
      if (p.length === 2 && /^\d\d$/.test(p[1])) {
        out += '<text x="' + x + '" y="' + (152 + dy) + '" font-size="10.5" fill="#6b7686" text-anchor="middle">' + esc(p[0]) + '</text>';
        if (i === 0 || p[0] === 'Jan' || i === last) out += '<text x="' + x + '" y="' + (164 + dy) + '" font-size="10.5" fill="#6b7686" text-anchor="middle">20' + p[1] + '</text>';
      } else { out += '<text x="' + x + '" y="' + (156 + dy) + '" font-size="10.5" fill="#6b7686" text-anchor="middle">' + esc(lb) + '</text>'; }
    });
    return out;
  }  /* a scale that is the same distance above and below zero, so zero is always a labelled tick */
  function symAxis(vals) { var m = Math.max.apply(null, vals.filter(function (v) { return v !== null; }).map(Math.abs)) * 1.1 || 1; return { min: -m, max: m }; }
  /* bars on the left scale, optional line on the right scale */
  function barLine(labels, bars, line, o) {
    var W = 520, H = 170, L = 52, R = 52, T = 12, B = 30, pw = W - L - R, ph = H - T - B;
    var hasLine = line && line.some(function (v) { return v !== null; }); var a = o.signColors ? symAxis(bars) : axis(o.sameAxis && hasLine ? bars.concat(line) : bars);

    var yl = o.sameAxis ? yb : function (v) { return T + (b.max - v) / (b.max - b.min) * ph; };

      out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#eef0f4"/>' +
        '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" font-size="10.5" fill="#6b7686" text-anchor="end">' + fmt(va, o.barDec) + '</text>' +
        (hasLine && !o.sameAxis ? '<text x="' + (W - R + 6) + '" y="' + (yy + 4) + '" font-size="10.5" fill="#d9822b">' + fmt(vb, o.lineDec) + '</text>' : '');
    }
    out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yb(0) + '" y2="' + yb(0) + '" stroke="#9aa5b5"/>';
    bars.forEach(function (v, i) {
      if (v === null) return;
      var x = L + i * step + (step - bw) / 2, y0 = yb(0), y1 = yb(v);
      out += '<rect x="' + x.toFixed(1) + '" y="' + Math.min(y0, y1).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, Math.abs(y1 - y0)).toFixed(1) + '" fill="' + (o.signColors ? (v >= 0 ? '#1a7f4b' : '#c0392b') : '#1a3a7a') + '"/>';
    });
    if (hasLine) {
      var pts = []; line.forEach(function (v, i) { if (v !== null) pts.push((L + i * step + step / 2).toFixed(1) + ',' + yl(v).toFixed(1)); });
      if (pts.length > 1) out += '<polyline fill="none" stroke="#d9822b" stroke-width="2" points="' + pts.join(' ') + '"/>';
    }
    if (o.leftTitle) out += '<text transform="rotate(-90 10 ' + (T + ph / 2) + ')" x="10" y="' + (T + ph / 2) + '" font-size="10.5" fill="#000" text-anchor="middle">' + esc(o.leftTitle) + '</text>';
    return out + xLabels(labels, W, L, step, o.every || Math.max(1, Math.round(labels.length / 8)), H - 170) + '</svg>';
  }
  /* one or more lines on one scale, with an optional reference line */
  /* two or more bars per month, one scale, for comparing changes (for example new full-time against new part-time jobs) */
  function groupedBars(labels, ser, o) {
    var W = 520, H = 200, L = 68, R = 16, T = 12, B = 40, pw = W - L - R, ph = H - T - B, all = [0];
    ser.forEach(function (s) { s.vals.forEach(function (v) { if (v !== null) all.push(v); }); });
    var gmn = Math.min.apply(null, all), gmx = Math.max.apply(null, all), tk = niceTicks(gmn, gmx, 6), tstep = tk[1] - tk[0];
    while (tk[tk.length - 1] < gmx - 1e-9) tk.push(tk[tk.length - 1] + tstep);
    while (tk[0] > gmn + 1e-9) tk.unshift(tk[0] - tstep);
    var lo = tk[0], hi = tk[tk.length - 1];
    var y = function (v) { return T + (hi - v) / (hi - lo) * ph; }, step = pw / labels.length, gw = step * 0.72, bw = gw / ser.length, out = '<svg width="100%" viewBox="0 0 ' + W + ' ' + H + '">';
    tk.forEach(function (v) { var yy = y(v); out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#eef0f4"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" font-size="10.5" fill="#000" text-anchor="end">' + fmt(v, 0) + '</text>'; });
    ser.forEach(function (s, k) { s.vals.forEach(function (v, i) { if (v === null) return; var x0 = L + i * step + (step - gw) / 2 + k * bw, y0 = y(0), y1 = y(v), flat = Math.abs(v) < 0.5; out += '<rect x="' + x0.toFixed(1) + '" y="' + (flat ? y0 - 1 : Math.min(y0, y1)).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (flat ? 2 : Math.max(1, Math.abs(y1 - y0))).toFixed(1) + '" fill="' + s.color + '"/>'; }); });
    if (o.leftTitle) out += '<text transform="rotate(-90 10 ' + (T + ph / 2) + ')" x="10" y="' + (T + ph / 2) + '" font-size="10.5" fill="#000" text-anchor="middle">' + esc(o.leftTitle) + '</text>';
    return out + xLabels(labels, W, L, step, 1, H - 170) + '</svg>';
  }  /* jobs created: bars per month (total, construction, professional and business) on the primary axis, a line (job openings) on the secondary axis, equal ticks on both */
  function jobsCombo(labels, ser, line, o) {
    var W = 520, H = 235, L = 62, R = 58, T = 12, B = 40, pw = W - L - R, ph = H - T - B, n = labels.length, step = pw / n, i, v, yy, bv = [];
    ser.forEach(function (s) { s.vals.forEach(function (x) { if (x !== null) bv.push(x); }); });
    var ap = axisPair(bv, line.vals, true), y1 = function (x) { return T + (ap.hi - x) / (ap.hi - ap.lo) * ph; }, y2 = function (x) { return T + (ap.rhi - x) / (ap.rhi - ap.rlo) * ph; }, out = '<svg width="100%" viewBox="0 0 ' + W + ' ' + H + '">';
    for (i = 0; i < ap.k; i++) { v = ap.lo + i * ap.step; yy = T + (ap.k - 1 - i) / (ap.k - 1) * ph; out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#eef0f4"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" font-size="10.5" fill="#000" text-anchor="end">' + fmt(v, ap.ld) + '</text>'; }
    for (i = 0; i < ap.k; i++) { v = ap.rlo + i * ap.rstep; yy = T + (ap.k - 1 - i) / (ap.k - 1) * ph; out += '<text x="' + (W - R + 6) + '" y="' + (yy + 4) + '" font-size="10.5" fill="#000">' + fmt(v, ap.rd) + '</text>'; }
    var gw = step * 0.8, bw = gw / ser.length, y0 = y1(0);
    ser.forEach(function (s, k) { s.vals.forEach(function (x, m) { if (x === null) return; var yb = y1(x), flat = Math.abs(x) < 0.5; out += '<rect x="' + (L + m * step + (step - gw) / 2 + k * bw).toFixed(1) + '" y="' + (flat ? y0 - 1 : Math.min(y0, yb)).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (flat ? 2 : Math.max(1, Math.abs(yb - y0))).toFixed(1) + '" fill="' + s.color + '"/>'; }); });
    var pts = [], dots = ''; line.vals.forEach(function (x, m) { if (x !== null) { var px = (L + m * step + step / 2).toFixed(1), py = y2(x).toFixed(1); pts.push(px + ',' + py); dots += '<circle cx="' + px + '" cy="' + py + '" r="3" fill="' + line.color + '"/>'; } });
    if (pts.length > 1) out += '<polyline fill="none" stroke="' + line.color + '" stroke-width="2" points="' + pts.join(' ') + '"/>' + dots;
    out += xLabels(labels, W, L, step, 1, H - 170);
    out += '<text transform="rotate(-90 10 ' + (T + ph / 2) + ')" x="10" y="' + (T + ph / 2) + '" font-size="10.5" fill="#000" text-anchor="middle">' + esc(o.leftTitle) + '</text><text transform="rotate(90 ' + (W - 8) + ' ' + (T + ph / 2) + ')" x="' + (W - 8) + '" y="' + (T + ph / 2) + '" font-size="10.5" fill="#000" text-anchor="middle">' + esc(o.rightTitle) + '</text></svg>';
    return out;
  }  function lineChart(labels, lines, o) {
    var W = o.compact ? 270 : 520, H = o.h || 170, L = o.compact ? 42 : 56, R = o.compact ? 12 : 56, T = 12, B = 30, pw = W - L - R, ph = H - T - B;
    var all = []; lines.forEach(function (ln) { all = all.concat(ln.vals); });
    var a = axis(all, o.ref !== undefined ? [o.ref] : []);
    if (o.ref === undefined) { var nums = all.filter(function (v) { return v !== null; }); var mn = Math.min.apply(null, nums), mx = Math.max.apply(null, nums), pad = (mx - mn) * 0.1 || 1; a = { min: mn - pad, max: mx + pad }; }
    if (o.fixed) a = o.fixed;
    if (o.zero) { var znums = all.filter(function (v) { return v !== null; }); a = { min: 0, max: Math.max.apply(null, znums) * 1.12 }; }
    var y = function (v) { return T + (a.max - v) / (a.max - a.min) * ph; };
    var step = pw / Math.max(1, labels.length), out = '<svg width="100%" viewBox="0 0 ' + W + ' ' + H + '">';
    var lt = niceTicks(a.min, a.max, 6), ld = 0; while (ld < 3 && lt.some(function (q) { return Math.abs(q * Math.pow(10, ld) - Math.round(q * Math.pow(10, ld))) > 1e-6; })) ld++;
    lt.forEach(function (va) { var yy = y(va); var nearRef = o.ref !== undefined && Math.abs(yy - y(o.ref)) < 12; out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#eef0f4"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" font-size="10.5" fill="#6b7686" text-anchor="end">' + (nearRef ? '' : fmt(va, ld) + (o.unit || '')) + '</text>'; });
    if (o.ref !== undefined) out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(o.ref) + '" y2="' + y(o.ref) + '" stroke="#1c2430" stroke-dasharray="5 4"/><text x="' + (L - 6) + '" y="' + (y(o.ref) + 4) + '" font-size="11.5" font-weight="700" fill="#000" text-anchor="end">' + fmt(o.ref, o.dec) + '</text>';
    lines.forEach(function (ln) {
      var pts = [], dots = '';
      ln.vals.forEach(function (v, i) { if (v !== null) { var px = (L + i * step + step / 2).toFixed(1), py = y(v).toFixed(1); pts.push(px + ',' + py); if (labels.length <= 14) dots += '<circle cx="' + px + '" cy="' + py + '" r="3.5" fill="' + ln.color + '"/>'; } });
      if (pts.length > 1) out += '<polyline fill="none" stroke="' + ln.color + '" stroke-width="2"' + (ln.dash ? ' stroke-dasharray="5 3"' : '') + ' points="' + pts.join(' ') + '"/>';
      out += dots;
    });
    if (o.endLabels) lines.forEach(function (ln, k) { var li = -1; ln.vals.forEach(function (v, i) { if (v !== null) li = i; }); if (li < 0) return; out += '<text x="' + (L + li * step + step / 2 + 8).toFixed(1) + '" y="' + (y(ln.vals[li]) + 4).toFixed(1) + '" font-size="10.5" fill="#000" font-weight="600">' + esc(o.endLabels[k]) + '</text>'; });
    if (o.leftTitle) out += '<text transform="rotate(-90 10 ' + (T + ph / 2) + ')" x="10" y="' + (T + ph / 2) + '" font-size="10.5" fill="#000" text-anchor="middle">' + esc(o.leftTitle) + '</text>';
    return out + xLabels(labels, W, L, step, o.every || Math.max(1, Math.round(labels.length / 8)), H - 170) + '</svg>';
  }
  /* actual numbers as a line on the left axis, the change from last month as bars on the right axis, one plot */
  function levelChange(labels, vals, bars, o) {
    var W = 520, H = 190, L = 50, R = 50, T = 12, B = 30, pw = W - L - R, ph = H - T - B, step = pw / Math.max(1, labels.length);

      ['United States: rigs', 'https://rigcount.bakerhughes.com/na-rig-count'], ['Canada: rigs', 'https://rigcount.bakerhughes.com/na-rig-count'],
      ['US crude oil stocks', 'https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=WCESTUS1&f=W'],
      ['Texas manufacturing', 'https://www.dallasfed.org/research/surveys/tmos'],
      ['Michigan Consumer Sentiment', F + 'UMCSENT'], ['Conference Board Consumer Confidence', CB], ['CPI (seasonally adjusted)', F + 'CPIAUCSL'], ['PCE (household spending)', F + 'PCE'],
      ['Retail and food services sales', F + 'RSAFS'], ['Real GDP growth, quarterly', F + 'A191RL1Q225SBEA'],
      ['Nonfarm payrolls and job openings', F + 'PAYEMS'], ['Jobs created: blue collar and white collar', 'https://www.bls.gov/news.release/empsit.t17.htm'], ['Unemployment rate and jobless claims', F + 'UNRATE'],
      ['US building permits and housing starts', F + 'PERMIT'], ['Building permits for the four cities', 'https://www.census.gov/construction/bps/'], ['Texas Metros Apartment Occupancy Rate', 'https://www.census.gov/housing/hvs/data/rates.html']
    ];
    var LEGEND_LINKS = { 'ISM Manufacturing PMI': 'https://www.prnewswire.com/news/institute-for-supply-management/', 'S&P Global US Manufacturing PMI': 'https://www.pmi.spglobal.com/Public/Release/PressReleases', 'Volume of job openings (thousands)': F + 'JTSJOL', 'National unemployment rate': F + 'UNRATE', 'Houston unemployment rate': F + 'HOUS448UR', 'Initial jobless claims, monthly average (right axis)': F + 'ICSA' };
    var STYLE = 'color:#1a3a7a;text-decoration:underline';
    function wrap(el, url) { el.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener" style="' + STYLE + '">' + el.innerHTML + '</a>'; }
    main.querySelectorAll('.card > h3').forEach(function (h) {
      if (h.querySelector('a')) return;
      for (var i = 0; i < TITLE_LINKS.length; i++) if (h.textContent.indexOf(TITLE_LINKS[i][0]) === 0) { wrap(h, TITLE_LINKS[i][1]); break; }
    });
    main.querySelectorAll('.card').forEach(function (c) {
      var h = c.querySelector(':scope > h3'); if (!h || !/PMIs|job openings|jobless claims/.test(h.textContent)) return;
      var w = document.createTreeWalker(c, NodeFilter.SHOW_TEXT), hit = [], n;
      while ((n = w.nextNode())) { var s = n.nodeValue.trim(); if (LEGEND_LINKS[s] && !n.parentNode.closest('a') && !n.parentNode.closest('h3') && !n.parentNode.closest('svg')) hit.push([n, s]); }
      hit.forEach(function (p) { var a = document.createElement('a'); a.href = LEGEND_LINKS[p[1]]; a.target = '_blank'; a.rel = 'noopener'; a.style.cssText = STYLE; a.textContent = p[0].nodeValue; p[0].parentNode.replaceChild(a, p[0]); });
    });
    var TILE_LINKS = { 'VIX': F + 'VIXCLS', '10-year real yield': F + 'DFII10', '10-year Treasury yield': F + 'DGS10', 'Fed funds rate (effective)': F + 'DFF', '30-year mortgage rate': F + 'MORTGAGE30US', 'ERCOT Texas power price': 'https://www.ercot.com/gridmktinfo/dashboards' };
    main.querySelectorAll('.tiles6 > .tile > .label:first-child').forEach(function (l) { var u = TILE_LINKS[l.textContent.trim()]; if (u && !l.querySelector('a')) wrap(l, u); });
    var hh = Array.prototype.filter.call(main.querySelectorAll('h2'), function (x) { return x.textContent.indexOf(TITLES.houston) === 0; })[0];
    var grid = hh && hh.nextElementSibling;
    if (grid) grid.querySelectorAll('.tile > .label').forEach(function (l) { if (!l.querySelector('a')) wrap(l, HAR); });
  })();
  /* the listening links are re-read every 3 minutes, so a new episode appears without refreshing the page */
  setInterval(function () {
    var s = document.createElement('script'); s.src = 'listening.js?t=' + Date.now();
    s.onload = function () { var box = document.getElementById('listenBox'); if (box && window.listenTable && window.LISTEN && LISTEN.items) box.innerHTML = listenTable(); s.remove(); };
    s.onerror = function () { s.remove(); };
    document.head.appendChild(s);
  }, 180000);
  document.getElementById('nav').innerHTML = navItems.filter(function (n) { return n[0] !== 'sources'; }).map(function (n) { return '<a href="#' + n[0] + '">' + esc(n[1].split(':')[0]) + '</a>'; }).join('');

  /* TradingView needs its script re-created to run when inserted with innerHTML */
  main.querySelectorAll('.tradingview-widget-container').forEach(function (holder) { var old = holder.querySelector('script'), neu = document.createElement('script'); neu.src = old.src; neu.async = true; neu.text = old.text; holder.replaceChild(neu, old); });
})();
</script>
