name: Update data

# Refreshes the dashboard and Gold page data on GitHub's own servers, so the site stays current when the owner's computer is off.
# Source copy lives with the owner's scripts. PUBLISH-ECON-SITE.ps1 copies it here, with personal details removed.
# Free for a public repository. Scheduled runs can start a few minutes late. The owner's computer still publishes too and stays the fallback.

on:
  schedule:
    - cron: '7,37 11-23 * * 1-5'   # every 30 minutes on weekdays, about 5 AM to 6 PM Central
    - cron: '15,25,45 20,21 * * 1-5'  # extra runs right after the market close (3:10 PM Central, the cutoff for a finished day), standard and daylight time
    - cron: '17 15 * * 0,6'        # once a day on weekends
  workflow_dispatch:
  push:
    paths:
      - '.github/test-trigger.txt'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the update scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          tzutil /s 'Central Standard Time'
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          $files = 'data.js','gold-spot.js','gold-etf.js','market.js','sentiment.js','crude.js','listening.js'
          foreach ($f in $files) { if (Test-Path $f) { Copy-Item $f $out -Force } }
          $env:ECON_OUT = $out
          $status = @()
          $scripts = 'UPDATE-ECON-DASHBOARD.ps1','UPDATE-ECON-VIX.ps1','UPDATE-ECON-MARKET.ps1','UPDATE-ECON-SENTIMENT.ps1','UPDATE-ECON-CRUDE.ps1','UPDATE-ECON-LISTENING.ps1','UPDATE-ECON-GOLD.ps1'
          foreach ($s in $scripts) {
            try {
              if ($s -eq 'UPDATE-ECON-DASHBOARD.ps1') { $o = & powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/$s" -Out $out 2>&1 | Out-String }
              else { $o = & powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/$s" 2>&1 | Out-String }
              $bad = ($LASTEXITCODE -ne 0) -or ($o -cmatch 'FAILED|Exception|cannot be found')
              $status += ($s + ': ' + $(if ($bad) { 'CHECK' } else { 'ok' }))
              if ($bad) { foreach ($ln in ($o -split "`n" | Where-Object { $_ -cmatch 'FAILED|Exception|cannot be found' } | Select-Object -First 6)) { $t2 = $ln.Trim(); $status += ('    ' + $t2.Substring(0, [math]::Min(200, $t2.Length))) } }
              Write-Host "=== $s"; Write-Host $o
            } catch { $status += ($s + ': FAILED'); Write-Host "=== $s FAILED: $_" }
          }
          # copy a file back only when it is complete (right start, not tiny)
          foreach ($f in $files) {
            $p = Join-Path $out $f
            if (-not (Test-Path $p)) { continue }
            $t = [IO.File]::ReadAllText($p)
            $minLen = if ($f -eq 'data.js') { 5000 } else { 200 }
            if ($t.Length -ge $minLen -and $t.TrimStart().Length -gt 0) { Copy-Item $p $f -Force } else { Write-Host "not copied (incomplete): $f"; $status += ($f + ': not copied') }
          }
          Set-Content -Path 'actions-status.txt' -Value ($status -join "`n") -Encoding UTF8
          $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          if (-not (Test-Path 'actions-heartbeat.txt') -or ((Get-Content 'actions-heartbeat.txt' -Raw).Trim() -ne $today)) { Set-Content -Path 'actions-heartbeat.txt' -Value $today -Encoding UTF8 }
          $summary = $status -join "`n"; if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary }

      - name: Commit and push when something changed
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Nothing changed.'; exit 0 }
          git commit -m ('Auto update ' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm') + ' UTC')
          git pull --rebase -X theirs
          git push
